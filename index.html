<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch a Sketch</title>
    <link rel="stylesheet" href="index.css" />
    <link
      rel="shortcut icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfSC-2XtgC4z1zMRyopAYQ9M382Rxt_DEgIIdZmxWNMQ"
      type="image/x-icon"
    />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Left Column: Toolbar / Controls -->
      <aside class="sidebar">
        <h1 class="title">Etch a Sketch</h1>

        <div class="control-group">
          <label for="color" class="btn btn-color">
            <span>Color Picker</span>
            <input type="color" id="color" value="#000000" />
          </label>

          <button id="rain_bow_btn" class="btn">Rainbow Mode</button>
          <button id="eraser_btn" class="btn">Eraser</button>
        </div>

        <div class="control-group divider">
          <button id="grid_size_btn" class="btn btn-secondary">
            Set Grid Size
          </button>
          <button id="clear_btn" class="btn btn-danger">Clear Canvas</button>
        </div>
      </aside>

      <!-- Right Column: Canvas Container -->
      <main class="canvas-wrapper">
        <div id="container"></div>
      </main>
    </div>
  </body>
</html>
